version: "2"
linters:
  enable:
    - asciicheck
    - bodyclose
    - gocognit
    - goconst
    - gocritic
    - gosec
    - nakedret
    - nestif
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - whitespace
  settings:
    goconst:
      min-occurrences: 5
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

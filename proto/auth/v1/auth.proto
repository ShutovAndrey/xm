syntax = "proto3";

package auth.v1;

option go_package = "gitlab.com/shutovAndrey/xm/gen/auth/v1;authv1";

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
}

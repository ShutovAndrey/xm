services:
  app:
    build: .
    ports:
      - "${GRPC_PORT:-50051}:50051"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xm}:${POSTGRES_PASSWORD:-xm}@db:5432/${POSTGRES_DB:-xm}?sslmode=disable
      GRPC_PORT: "50051"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_TTL: ${JWT_TTL:-1h}
      BROKER_HOST: broker
      BROKER_PORT: "9090"
      BROKER_TOPIC: ${BROKER_TOPIC:-companies}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xm}
      POSTGRES_DB: ${POSTGRES_DB:-xm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xm} -d ${POSTGRES_DB:-xm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # go-kafka message broker, built from its repository.
  broker:
    build: https://gitlab.com/shutovAndrey/go-kafka.git
    environment:
      LOG_LEVEL: info
      LOG_PATH: /tmp/go-kafka
    ports:
      - "${BROKER_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Inserts test users (see seeds/users.sql) once the app has applied migrations.
  seed:
    image: postgres:17-alpine
    depends_on:
      app:
        condition: service_started
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-xm}
      PGPASSWORD: ${POSTGRES_PASSWORD:-xm}
      PGDATABASE: ${POSTGRES_DB:-xm}
    volumes:
      - ./seeds:/seeds:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until psql -tAc "SELECT 1 FROM users LIMIT 1" >/dev/null 2>&1; do sleep 1; done
        psql -v ON_ERROR_STOP=1 -f /seeds/users.sql
    restart: "no"

volumes:
  pgdata:
